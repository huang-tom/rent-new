server {
    listen       80;
    server_name  _;

    root  /var/www/html/public;
    index index.php;

    charset utf-8;
    client_max_body_size 64m;

    # 上传的图片/附件等静态资源
    location ~* \.(jpg|jpeg|png|gif|webp|ico|css|js|svg|woff2?|ttf|map)$ {
        try_files $uri =404;
        access_log off;
        expires 7d;
    }

    # 其余全部交给 Lumen 入口（路由都在根路径下：/manage/...、/front/...）
    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ \.php$ {
        try_files $uri =404;
        fastcgi_pass   api:9000;
        fastcgi_index  index.php;
        fastcgi_param  SCRIPT_FILENAME  $document_root$fastcgi_script_name;
        fastcgi_param  SCRIPT_NAME      $fastcgi_script_name;
        fastcgi_read_timeout 300;
        include        fastcgi_params;
    }

    # Lumen 不需要 .htaccess
    location ~ /\.(?!well-known).* {
        deny all;
    }
}
