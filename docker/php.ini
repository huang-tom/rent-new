[PHP]
; 上传 / 表单体积（原版后台有素材上传、商品批量操作）
upload_max_filesize = 64M
post_max_size       = 64M
memory_limit        = 512M
max_execution_time  = 300
max_input_time      = 300

; 时区（bootstrap/app.php 里已硬编码 Asia/Shanghai）
date.timezone = Asia/Shanghai

; 错误显示（本地调试方便，生产请关）
display_errors = On
error_reporting = E_ALL & ~E_DEPRECATED & ~E_NOTICE

; OPcache
opcache.enable = 1
opcache.validate_timestamps = 1
opcache.revalidate_freq = 0
